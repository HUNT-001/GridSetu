name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - name: Tests (physics, safety rules, copilot, numbers registry)
        run: python -m pytest -q
      - name: README figures match outputs/numbers.json
        run: PYTHONPATH=src python -m gridsetu numbers --check README.md

  reproduce:
    # Re-runs the full 3-seed study and fails if any committed result changes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: bash scripts/reproduce.sh
