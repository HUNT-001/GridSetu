[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridsetu"
version = "0.1.0"
description = "GridSetu Phase 1: multi-layer smart-grid simulator (market, dispatch, feeder reliability reserve, WAMS)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "matplotlib>=3.8", "pyyaml>=6",
  "pyomo>=6.7", "highspy>=1.7", "lightgbm>=4.3", "pandapower>=2.14",
  "fastapi>=0.110", "uvicorn>=0.29", "orjson>=3.9", "pypsa>=0.33", "anthropic>=0.40", "httpx>=0.27", "paho-mqtt>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
fast = ["numba>=0.59"]

[project.scripts]
gridsetu = "gridsetu.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore"]
